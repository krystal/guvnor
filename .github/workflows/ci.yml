name: CI
on: [push]

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-go@v2
        with:
          go-version: 1.18
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v2
        with:
          version: v1.45.2
          args: --timeout 5m0s
          # Use the Go 1.18 from setup-go. Otherwise the action installs the
          # latest Go, which golangci-lint 1.45.2 can't load packages from.
          skip-go-installation: true
        env:
          VERBOSE: "true"
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-go@v2
        with:
          go-version: 1.18
      - name: run tests
        run: go test ./...